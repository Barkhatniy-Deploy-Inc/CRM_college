# docker-compose.test.yml
# Конфигурация для локального тестирования с PostgreSQL

version: '3.8'

services:
  # Auth Service
  backend-auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-auth:latest
    environment:
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=testpassword
      - SECRET_KEY=test-secret-key-for-development-only-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://localhost:80
    ports:
      - "8002:8002"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Schedule Backend Service
  backend-schedule:
    build:
      context: ./backend/schedule
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-schedule:latest
    environment:
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=schedule_db
      - DB_USER=postgres
      - DB_PASSWORD=testpassword
      - SECRET_KEY=test-secret-key-for-development-only-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://localhost:80
      - AUTH_SERVICE_URL=http://backend-auth:8002
    ports:
      - "8000:8000"
    depends_on:
      - db
      - backend-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Techcard Backend Service  
  backend-techcard:
    build:
      context: ./backend/techcard
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-techcard:latest
    environment:
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=techcard_db
      - DB_USER=postgres
      - DB_PASSWORD=testpassword
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://localhost:80
    ports:
      - "8001:8000"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend-auth
      - backend-schedule
      - backend-techcard
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data

volumes:
  postgres_test_data:
  redis_test_data: