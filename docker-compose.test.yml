version: '3.8'

services:
  # Auth Service
  backend-auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-auth:test
    environment:
      - ENVIRONMENT=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "8002:8002"
    # External PostgreSQL - no local dependency
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Schedule Backend Service
  backend-schedule:
    build:
      context: ./backend/schedule
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-schedule:test
    environment:
      - ENVIRONMENT=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AUTH_SERVICE_URL=http://backend-auth:8002
    ports:
      - "8000:8000"
    depends_on:
      - backend-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Techcard Backend Service  
  backend-techcard:
    build:
      context: ./backend/techcard
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-backend-techcard:test
    environment:
      - ENVIRONMENT=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${TECHCARD_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/xytrax9/college-frontend:test
    ports:
      - "80:80"
    depends_on:
      - backend-auth
      - backend-schedule
      - backend-techcard
    restart: unless-stopped
