events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    server_tokens off;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # ngrok terminates TLS; preserve the external scheme for redirects.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream auth_service { zone auth_service 64k; server auth:8000 resolve; }
    upstream schedule_service { zone schedule_service 64k; server schedule:8000 resolve; }
    upstream techcard_service { zone techcard_service 64k; server techcard:8000 resolve; }
    upstream frontend_service { zone frontend_service 64k; server frontend:80 resolve; }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Audit writes from services use the internal network directly.
        location ^~ /api/users/audit-log/internal { return 404; }
        location ~ ^/api/(auth|users)(/|$) { proxy_pass http://auth_service; }
        location ~ ^/api/(schedule|relations)(/|$) { proxy_pass http://schedule_service; }
        location ~ ^/api/(techcard|techcards)(/|$) { proxy_pass http://techcard_service; }

        location = /ws {
            proxy_pass http://schedule_service;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Unknown API routes must return an API error instead of the SPA HTML.
        location /api/ {
            default_type application/json;
            return 404 '{"detail":"Unknown API route"}';
        }

        location / {
            proxy_pass http://frontend_service;
        }
    }
}
