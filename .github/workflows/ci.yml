name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend-common:
    name: Backend common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/common/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q

  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            coverage: 75
          - service: schedule
            coverage: 50
          - service: techcard
            coverage: 60
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/${{ matrix.service }}/requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r ../../requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        env:
          TESTING: "1"
        run: pytest -q --cov=. --cov-report=term --cov-fail-under=${{ matrix.coverage }}

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --source . --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          for req in backend/auth/requirements.txt backend/schedule/requirements.txt backend/techcard/requirements.txt; do
            echo "== pip-audit $req =="
            pip-audit -r "$req"
          done
