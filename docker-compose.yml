name: crm_college

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - crm_network

x-backend-env: &backend-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/local.sh init first}
  SECRET_KEY: ${SECRET_KEY:?Run ./scripts/local.sh init first}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  AUTH_SERVICE_URL: http://auth:8000
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:
  nginx:
    <<: *runtime
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      schedule:
        condition: service_healthy
      techcard:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    <<: *runtime
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./scripts/local.sh init first}
      POSTGRES_DB: postgres
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      SCHEDULE_DB_NAME: ${SCHEDULE_DB_NAME:-schedule_db}
      TECHCARD_DB_NAME: ${TECHCARD_DB_NAME:-techcard_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth:
    <<: *runtime
    build: ./backend/auth
    environment:
      <<: *backend-env
      DB_TYPE: postgresql
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run ./scripts/local.sh init first}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  schedule:
    <<: *runtime
    build: ./backend/schedule
    environment:
      <<: *backend-env
      DB_NAME: ${SCHEDULE_DB_NAME:-schedule_db}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run ./scripts/local.sh init first}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/schedule/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  techcard:
    <<: *runtime
    build: ./backend/techcard
    environment:
      <<: *backend-env
      TECHCARD_DB_NAME: ${TECHCARD_DB_NAME:-techcard_db}
      SCHEDULE_SERVICE_URL: http://schedule:8000
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/techcard/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    <<: *runtime
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ngrok:
    <<: *runtime
    image: ngrok/ngrok:3-alpine
    profiles: ["tunnel"]
    restart: "no"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "http://nginx:80", "--config=/etc/ngrok.yml", "--log=stdout"]
    volumes:
      - ./ngrok/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  crm_network:
    driver: bridge
