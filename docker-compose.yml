services:
  # Traefik reverse proxy
  # Nginx Gateway
  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - schedule
      - techcard
      - frontend
    networks:
      - crm_network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_dump.sql:/docker-entrypoint-initdb.d/postgres_dump.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # Auth микросервис (внешний порт 8002 -> внутренний 8000)
  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: crm_auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@db:5432/${AUTH_DB_NAME:-auth_db}?schema=public
      - SECRET_KEY=${SECRET_KEY:-your_super_secret_key_here}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm_network

  # Schedule микросервис (внешний порт 8000 -> внутренний 8000)
  schedule:
    build:
      context: ./backend/schedule
      dockerfile: Dockerfile
    container_name: crm_schedule
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-schedule_db}?schema=public
      - SECRET_KEY=${SECRET_KEY:-your_super_secret_key_here}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm_network

  # TechCard микросервис (внешний порт 8001 -> внутренний 8000)
  techcard:
    build:
      context: ./backend/techcard
      dockerfile: Dockerfile
    container_name: crm_techcard
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@db:5432/${TECHCARD_DB_NAME:-techcard_db}?schema=public
      - SECRET_KEY=${SECRET_KEY:-your_super_secret_key_here}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm_network

  # Frontend сервис
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth
      - schedule
      - techcard
    networks:
      - crm_network

volumes:
  postgres_data:
    driver: local

networks:
  crm_network:
    driver: bridge
